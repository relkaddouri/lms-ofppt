<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #FFFFFF; }
  a { color: #2E7D9E; text-decoration: none; }
  a:hover { color: #2E3B4E; }
</style>
</helmet>
<div style="width:375px;margin:0 auto;min-height:100vh;background:#FFFFFF;font-family:'Source Sans 3',system-ui,sans-serif;color:#2E3B4E;position:relative;padding-bottom:86px;box-sizing:border-box">

  <div style="position:sticky;top:0;z-index:30;background:#FFFFFF;border-bottom:1px solid #EDF0F3">
    <div style="padding:16px 20px 14px;display:flex;align-items:center;gap:12px">
      <span style="width:42px;height:42px;border-radius:50%;flex:none;background:#2E3B4E;color:#FFFFFF;font-family:Sora,sans-serif;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center">YB</span>
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span style="font-family:Sora,sans-serif;font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Youssef Benali</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#8C99A8">TSDI-201 · 2ᵉ année</span>
      </div>
      <button type="button" aria-label="Notifications" style="margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid #E3E7EC;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative;flex:none" style-hover="background:#F6F7F9">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-3 7-3 7h18s-3-1-3-7"></path><path d="M10.3 20a2 2 0 0 0 3.4 0"></path></svg>
        <span style="position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:#E2574C;color:#FFFFFF;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10.5px;display:flex;align-items:center;justify-content:center;border:2px solid #FFFFFF;box-sizing:border-box">3</span>
      </button>
    </div>
  </div>

  <div style="padding:22px 20px 10px;display:flex;flex-direction:column;gap:6px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A9B4C0">Fil du groupe</span>
    <h1 style="font-family:Sora,sans-serif;font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0">Annonces</h1>
  </div>

  <sc-for list="{{ posts }}" as="p" hint-placeholder-count="3">
    <div style="padding:22px 20px;border-top:1px solid #EDF0F3;display:flex;flex-direction:column;gap:14px">

      <div style="display:flex;align-items:center;gap:11px">
        <span style="width:36px;height:36px;border-radius:50%;flex:none;background:#2E3B4E;color:#FFFFFF;font-family:Sora,sans-serif;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center">SL</span>
        <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
          <span style="font-weight:600;font-size:14.5px">Samira Lahlou</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A9B4C0">{{ p.when }} · {{ p.module }}</span>
        </div>
        <span style="margin-left:auto;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;color:{{ p.tagInk }};background:{{ p.tagBg }};border:1px solid {{ p.tagLine }}">{{ p.tag }}</span>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px">
        <h2 style="font-family:Sora,sans-serif;font-weight:600;font-size:19px;line-height:1.3;margin:0">{{ p.title }}</h2>
        <p style="margin:0;font-size:16px;line-height:1.65;color:#3F4E62;text-wrap:pretty">{{ p.body }}</p>
      </div>

      <div style="display:flex;align-items:center;gap:8px">
        <button type="button" onClick="{{ p.like }}" style="display:flex;align-items:center;gap:8px;font-family:'Source Sans 3',sans-serif;font-weight:600;font-size:14px;border-radius:11px;padding:11px 15px;cursor:pointer;min-height:44px;box-sizing:border-box;color:{{ p.likeInk }};background:{{ p.likeBg }};border:1px solid {{ p.likeLine }}">
          <svg width="17" height="17" style="flex:none" viewBox="0 0 24 24" fill="{{ p.likeFill }}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21V10l4.5-7A2.2 2.2 0 0 1 14 5.3l-.8 4.2h5a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 16.8 21H7z"></path></svg>
          J'aime <span style="font-family:'IBM Plex Mono',monospace;font-weight:500">{{ p.likes }}</span>
        </button>
        <button type="button" onClick="{{ p.toggle }}" style="display:flex;align-items:center;gap:8px;font-family:'Source Sans 3',sans-serif;font-weight:600;font-size:14px;color:#3F4E62;background:#FFFFFF;border:1px solid #C9D2DC;border-radius:11px;padding:11px 15px;cursor:pointer;min-height:44px;box-sizing:border-box" style-hover="background:#F6F7F9;border-color:#2E3B4E">
          <svg width="17" height="17" style="flex:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-8 8H7l-3 2v-4.5A8 8 0 1 1 20 12z"></path></svg>
          Commenter <span style="font-family:'IBM Plex Mono',monospace;font-weight:500">{{ p.commentCount }}</span>
        </button>
      </div>

      <sc-if value="{{ p.open }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:12px;padding-top:6px">
          <sc-for list="{{ p.comments }}" as="c" hint-placeholder-count="2">
            <div style="display:flex;gap:11px">
              <span style="width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:600;font-size:11px;color:{{ c.avatarInk }};background:{{ c.avatarBg }}">{{ c.initials }}</span>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
                <div style="display:flex;align-items:baseline;gap:9px">
                  <span style="font-weight:600;font-size:14px">{{ c.name }}</span>
                  <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#A9B4C0">{{ c.when }}</span>
                  <sc-if value="{{ c.mine }}" hint-placeholder-val="{{ false }}">
                    <button type="button" aria-label="Supprimer mon commentaire" onClick="{{ c.remove }}" style="margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none" style-hover="background:#FCEDEB;border-color:#F3CFCB">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8433A" stroke-width="2" stroke-linecap="round"><path d="M6 7h12"></path><path d="M9 7V5h6v2"></path><path d="M7 7l1 12h8l1-12"></path></svg>
                    </button>
                  </sc-if>
                </div>
                <p style="margin:0;font-size:15px;line-height:1.6;color:#3F4E62;text-wrap:pretty">{{ c.before }}<span style="font-weight:600;color:#245F79;background:#E8F2F7;border-radius:5px;padding:1px 6px">{{ c.mention }}</span>{{ c.after }}</p>
              </div>
            </div>
          </sc-for>

          <div style="display:flex;align-items:center;gap:9px;padding-top:2px">
            <span style="width:32px;height:32px;border-radius:50%;flex:none;background:#2E3B4E;color:#FFFFFF;font-family:Sora,sans-serif;font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center">YB</span>
            <input type="text" placeholder="Écrire un commentaire…" style="flex:1;min-width:0;border:1px solid #C9D2DC;border-radius:999px;outline:none;background:#FFFFFF;font-family:'Source Sans 3',sans-serif;font-size:14.5px;color:#2E3B4E;padding:11px 15px;min-height:44px;box-sizing:border-box" />
            <button type="button" aria-label="Envoyer" style="width:44px;height:44px;border-radius:50%;flex:none;background:#2E3B4E;border:1px solid #2E3B4E;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0" style-hover="background:#25303F">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-6z"></path></svg>
            </button>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-for>

  <div style="padding:26px 20px 8px;border-top:1px solid #EDF0F3;display:flex;justify-content:center">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#C3CBD5">Fin du fil · 3 annonces</span>
  </div>

  <nav style="position:fixed;bottom:0;left:0;right:0;width:375px;margin:0 auto;background:#FFFFFF;border-top:1px solid #E3E7EC;box-shadow:0 -4px 16px rgba(46,59,78,.06);display:flex;align-items:stretch;padding:8px 4px 12px;box-sizing:border-box;z-index:40">
    <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
      <button type="button" onClick="{{ n.pick }}" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:none;padding:7px 2px;cursor:pointer;min-height:44px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ n.ink }}" stroke-width="{{ n.stroke }}" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.icon }}"></path></svg>
        <span style="font-family:'Source Sans 3',sans-serif;font-size:10.5px;font-weight:{{ n.weight }};color:{{ n.ink }};white-space:nowrap">{{ n.label }}</span>
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:812}}">
class Component extends DCLogic {
  state = {
    nav: "Fil",
    open: { 0: true },
    likes: { 0: 14, 1: 21, 2: 9 },
    liked: { 0: true },
    removed: {}
  };

  data() {
    return [
      {
        when: "il y a 2 h", module: "M104", tag: "Organisation", tagInk: "#245F79", tagBg: "#E8F2F7", tagLine: "#CBE0EA",
        title: "Report du TP 3 au 23/09",
        body: "Le TP sur l'intégration continue est décalé au 23 septembre, même créneau. Installez Git avant la séance : la salle B12 ne permettra pas les installations.",
        comments: [
          { key: "0-0", initials: "AK", name: "Amine Kabbaj", when: "il y a 1 h", avatarBg: "#2E7D9E", avatarInk: "#FFFFFF", mine: false,
            before: "Il faut la version en ligne de commande ou l'interface graphique ? ", mention: "@Salma Idrissi", after: " tu avais installé quoi ?" },
          { key: "0-1", initials: "YB", name: "Vous", when: "il y a 40 min", avatarBg: "#2E3B4E", avatarInk: "#FFFFFF", mine: true,
            before: "J'ai pris la ligne de commande, ça suffit pour le TP. ", mention: "@Amine Kabbaj", after: " je t'envoie le lien ce soir." }
        ]
      },
      {
        when: "12/09 · 09:05", module: "M115", tag: "Ressources", tagInk: "#2C6C46", tagBg: "#EAF3EE", tagLine: "#CFE4D8",
        title: "Sujets de projet fil rouge disponibles",
        body: "Les six sujets sont déposés dans l'espace ressources. Remontez vos binômes avant vendredi 19 septembre, dernier délai.",
        comments: [
          { key: "1-0", initials: "IC", name: "Imane Chraibi", when: "12/09", avatarBg: "#EFF2F5", avatarInk: "#5B6A7D", mine: false,
            before: "Les binômes peuvent être inter-groupes ? ", mention: "@Hajar Ouazzani", after: " est en TSDI-102." }
        ]
      },
      {
        when: "09/09 · 17:40", module: "M106", tag: "Évaluation", tagInk: "#B8433A", tagBg: "#FCEDEB", tagLine: "#F3CFCB",
        title: "Rappel : CC1 du module M106 le 19/09",
        body: "Contrôle d'une heure trente sur la modélisation et les requêtes de base. Documents non autorisés.",
        comments: []
      }
    ];
  }

  renderVals() {
    const st = this.state;
    const nav = [
      { key: "Fil", label: "Fil", icon: "M4 10v9h16v-9 M2.5 10.5 12 3.5l9.5 7" },
      { key: "Cours", label: "Cours", icon: "M12 7v13 M12 7a2.5 2.5 0 0 0-2.5-2.5H4v13h5.5A2.5 2.5 0 0 1 12 20 M12 7a2.5 2.5 0 0 1 2.5-2.5H20v13h-5.5A2.5 2.5 0 0 0 12 20" },
      { key: "Devoirs", label: "Devoirs", icon: "M6 3.5h9L19 8v12.5H6z M9 12h7 M9 16h5" },
      { key: "Contrôles", label: "Contrôles", icon: "M9 11.5 11.5 14 16 8.5 M4 3.5h16v17H4z" },
      { key: "Emploi", label: "Emploi du temps", icon: "M3.5 5h17v16h-17z M8 3v4 M16 3v4 M3.5 10h17" }
    ];

    return {
      navItems: nav.map(n => {
        const on = n.key === st.nav;
        return {
          label: n.label,
          icon: n.icon,
          pick: () => this.setState({ nav: n.key }),
          ink: on ? "#2E3B4E" : "#A9B4C0",
          stroke: on ? "2.2" : "1.8",
          weight: on ? "600" : "400"
        };
      }),

      posts: this.data().map((p, i) => ({
        when: p.when, module: p.module, title: p.title, body: p.body,
        tag: p.tag, tagInk: p.tagInk, tagBg: p.tagBg, tagLine: p.tagLine,
        open: !!st.open[i],
        toggle: () => this.setState(s => ({ open: Object.assign({}, s.open, { [i]: !s.open[i] }) })),
        likes: st.likes[i],
        like: () => this.setState(s => {
          const on = !!s.liked[i];
          return {
            liked: Object.assign({}, s.liked, { [i]: !on }),
            likes: Object.assign({}, s.likes, { [i]: s.likes[i] + (on ? -1 : 1) })
          };
        }),
        likeInk: st.liked[i] ? "#245F79" : "#3F4E62",
        likeBg: st.liked[i] ? "#E8F2F7" : "#FFFFFF",
        likeLine: st.liked[i] ? "#CBE0EA" : "#C9D2DC",
        likeFill: st.liked[i] ? "#CBE0EA" : "none",
        comments: p.comments.filter(c => !st.removed[c.key]).map(c => Object.assign({}, c, {
          remove: () => this.setState(s => ({ removed: Object.assign({}, s.removed, { [c.key]: true }) }))
        })),
        commentCount: p.comments.filter(c => !st.removed[c.key]).length
      }))
    };
  }
}
</script>
</body>
</html>
